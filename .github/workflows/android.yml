name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Restore or generate Debug Keystore
      run: |
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        else
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit & Robolectric Tests
      run: ./gradlew :app:testDebugUnitTest --no-daemon

    - name: Upload Test Report on Failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-results
        path: app/build/reports/tests/testDebugUnitTest/

    - name: Build Android Debug APK
      run: ./gradlew :app:assembleDebug --no-daemon

    - name: Build Android App Bundle (AAB)
      run: ./gradlew :app:bundleDebug --no-daemon

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: TellMeWhatYouSee-debug-apk
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload Debug AAB Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: TellMeWhatYouSee-debug-aab
        path: app/build/outputs/bundle/debug/*.aab
